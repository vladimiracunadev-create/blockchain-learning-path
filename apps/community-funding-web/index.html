<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Community Funding</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <main>
    <p class="tag">TESTNET / LOCAL ONLY</p>
    <h1>Community Funding</h1>
    <p id="network">Verificando red…</p>
    <section>
      <h2>Conectar</h2>
      <button id="connect">Conectar wallet</button>
      <output id="account">Sin conexión</output>
    </section>
    <section>
      <h2>Consultar campaña</h2>
      <label>ID <input id="campaignId" type="number" min="1" value="1"></label>
      <button id="read">Leer estado</button>
      <pre id="campaign">Sin datos</pre>
    </section>
    <section>
      <h2>Contribuir</h2>
      <label>ETH de prueba <input id="amount" type="number" min="0" step="0.001" value="0.01"></label>
      <button id="contribute">Simular y solicitar firma</button>
      <output id="status">La interfaz mostrará simulación antes de enviar.</output>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
