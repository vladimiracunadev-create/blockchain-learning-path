name: Deploy Pages

# Publica en GitHub Pages la portada (site/index.html) y el sitio navegable
# generado a partir de todos los .md del repositorio. El filtro de rutas cubre
# todo lo que acaba renderizado en el sitio.

on:
  push:
    branches: ["main"]
    paths:
      - "curriculum/**"
      - "industria/**"
      - "labs/**"
      - "adrs/**"
      - "docs/**"
      - "capstone/**"
      - "learning-paths/**"
      - "instructor/**"
      - "student/**"
      - "solutions/**"
      - "security-challenges/**"
      - "assessments/**"
      - "apps/**/README.md"
      - "projects/**/README.md"
      - "*.md"
      - "package.json"
      - "scripts/build-landing.mjs"
      - "scripts/build-site.mjs"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Generar landing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Instalar dependencias (pnpm)
        run: pnpm install --frozen-lockfile

      # El manual ya no se versiona (pesaba 10 MB y crecía el historial en cada
      # regeneración): se construye aquí y en cada release. Debe ir ANTES del
      # sitio, porque build:site lo enlaza en el menú y lo copia a site/manual/.
      - name: Generar el manual en PDF
        run: pnpm build:manual

      - name: Comprobar que el manual tiene el tamaño anunciado
        run: node scripts/check-manual.mjs

      - name: Generar portada y sitio navegable
        run: |
          pnpm build:landing
          pnpm build:site

      - name: Comprobar que el sitio salió completo
        run: |
          set -euo pipefail
          [ -s site/index.html ] || { echo "::error::falta o está vacío site/index.html"; exit 1; }
          for needle in "Blockchain Learning Path" "Qué incluye" "Cómo se aprende"; do
            grep -q "$needle" site/index.html || { echo "::error::la portada no contiene: $needle"; exit 1; }
          done
          for f in site/curriculum/README.html site/curriculum/01-criptografia/README.html \
                   site/labs/CATALOG.html site/industria/README.html; do
            [ -s "$f" ] || { echo "::error::falta o está vacío: $f"; exit 1; }
          done
          [ -s site/manual/MANUAL.pdf ] || { echo "::error::falta el manual: site/manual/MANUAL.pdf"; exit 1; }
          paginas=$(find site -name '*.html' | wc -l)
          [ "$paginas" -ge 60 ] || { echo "::error::solo $paginas páginas HTML, esperaba 60+"; exit 1; }
          {
            echo "### 🌐 Sitio generado"
            echo "- Páginas HTML: **$paginas**"
            echo "- Manual PDF: **$(du -h site/manual/MANUAL.pdf | cut -f1)**"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publicar
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
