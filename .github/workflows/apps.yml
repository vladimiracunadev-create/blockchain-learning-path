name: Apps

# Construye la app de escritorio (Windows) y la app Android, y —lo importante—
# ABRE cada binario para comprobar que el curso está dentro.
#
# Un build en verde no prueba que el artefacto sirva: el caso que se repite es un
# instalador que pesa lo esperado, se instala sin error y abre una ventana vacía
# porque el contenido nunca llegó a copiarse. Por eso cada job termina con un
# paso de verificación que cuenta módulos, páginas y preguntas DENTRO del binario.

on:
  push:
    branches: ["main"]
    paths:
      - "apps/**"
      - "curriculum/**"
      - "scripts/build-site.mjs"
      - "scripts/build-landing.mjs"
      - "scripts/build-app-bundle.mjs"
      - "scripts/build-icons.mjs"
      - "assessments/**"
      - ".github/workflows/apps.yml"
  pull_request:
    paths:
      - "apps/**"
      - "scripts/build-app-bundle.mjs"
      - ".github/workflows/apps.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  escritorio:
    name: Windows (instalador + portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Generar iconos
        run: pnpm build:icons

      # El manual ya no está en git: si no se genera aquí, la app se empaqueta
      # sin él y el verificador lo rechaza (que es justo lo que debe hacer).
      - name: Generar el manual en PDF
        run: pnpm build:manual

      - name: Comprobar que el manual tiene el tamaño anunciado
        run: node scripts/check-manual.mjs

      - name: Generar el bundle del curso
        run: pnpm build:bundle

      - name: Verificar la app sin empaquetar
        run: pnpm app:windows:verify

      - name: Empaquetar (NSIS + portable)
        run: pnpm --filter @blockchain-course/desktop dist

      - name: Verificar que el instalador CONTIENE el curso
        shell: pwsh
        run: |
          $empaquetada = "apps/desktop/dist/win-unpacked/resources/bundle"
          if (-not (Test-Path "$empaquetada/index.html")) {
            throw "El instalador no lleva el curso dentro ($empaquetada)"
          }
          $esperados = (Get-ChildItem "curriculum" -Directory | Where-Object { $_.Name -match '^\d{2}-' }).Count
          $modulos = (Get-ChildItem "$empaquetada/curriculum" -Directory | Where-Object { $_.Name -match '^\d{2}-' }).Count
          $paginas = (Get-ChildItem $empaquetada -Recurse -Filter *.html).Count
          if ($modulos -ne $esperados) { throw "La app empaquetada tiene $modulos módulos, se esperaban $esperados" }
          if ($paginas -lt 80) { throw "La app empaquetada tiene $paginas páginas, se esperaban 80 o más" }
          "✅ App empaquetada: $modulos módulos, $paginas páginas" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          Get-ChildItem apps/desktop/dist/*.exe | ForEach-Object {
            "- $($_.Name) — $([math]::Round($_.Length/1MB,1)) MB" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          }

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: apps/desktop/dist/*.exe
          if-no-files-found: error

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      # Capacitor 7 no compila con un JDK anterior al 21.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4

      - run: pnpm install --frozen-lockfile

      - name: Generar iconos
        run: pnpm build:icons

      # El manual ya no está en git: si no se genera aquí, la app se empaqueta
      # sin él y el verificador lo rechaza (que es justo lo que debe hacer).
      - name: Generar el manual en PDF
        run: pnpm build:manual

      - name: Comprobar que el manual tiene el tamaño anunciado
        run: node scripts/check-manual.mjs

      - name: Generar el bundle del curso
        run: pnpm build:bundle

      - name: Construir el APK
        run: |
          cd apps/android
          node preparar.mjs
          npx cap add android
          node personalizar.mjs
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Verificar que el APK CONTIENE el curso
        run: |
          node apps/android/verificar-apk.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Renombrar el APK
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p apk
          cp apps/android/android/app/build/outputs/apk/debug/app-debug.apk \
             "apk/BlockchainLearningPath-${version}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: apk/*.apk
          if-no-files-found: error
