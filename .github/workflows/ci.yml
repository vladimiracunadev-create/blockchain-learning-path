name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: markdownlint-cli2
        run: npx --yes markdownlint-cli2 "**/*.md"

  node:
    name: Scripts y pruebas (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm check
      - run: pnpm test

  solidity:
    name: Contratos (Foundry)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - labs/06-solidity-vault
          - labs/08-protocols
          - projects/community-funding
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install foundry-rs/forge-std
      - run: forge test -vv
      - name: Resumen de cobertura (informativo)
        run: forge coverage --report summary || true

  static-analysis:
    # El módulo 09 enseña Slither; aquí la CI lo ejecuta sobre los contratos de
    # producción. Es informativo (no bloquea): los hallazgos se revisan, no se
    # convierten en un muro que impida avanzar. Los retos de seguridad son
    # vulnerables a propósito y se analizan en su propio laboratorio.
    name: Análisis estático (Slither)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        project:
          - labs/06-solidity-vault
          - labs/08-protocols
          - projects/community-funding
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install foundry-rs/forge-std
        working-directory: ${{ matrix.project }}
      - uses: crytic/slither-action@v0.4.1
        with:
          target: ${{ matrix.project }}
          fail-on: none

  security-contracts:
    name: Retos de seguridad (exploit + fix)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: security-challenges
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install foundry-rs/forge-std
      - run: forge test -vv

  web:
    name: dApp (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @blockchain-course/community-funding-web build
