version: 2
updates:
  # Dependencias pnpm del monorepo (dApp, indexador, panel).
  # GitHub exige el identificador "npm" para npm, yarn y pnpm; el lockfile
  # canónico del repositorio sigue siendo pnpm-lock.yaml.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      pnpm:
        patterns:
          - "*"

  # Mantiene al día las GitHub Actions de los workflows: abre un PR semanal
  # cuando hay una versión nueva de alguna acción usada.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
